spring.application.name=venta-condominio

# Railway asigna el puerto en la variable PORT; en local sigue siendo 8080
server.port=${PORT:8080}

# URLs del frontend autorizadas (CORS). En producción: CORS_ORIGINS=https://tu-app.vercel.app
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Correo: en producción se usa la API de Brevo (BREVO_API_KEY);
# en local, si no hay BREVO_API_KEY, se usa SMTP de Gmail.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.remitente=${MAIL_FROM:fuentesthomasito777@gmail.com}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000